<main id="main">

  <section class="section section--content section--contact">
    <div class="grid grid--rows" style="--rows:15">

      <!-- Left column: intro + LinkedIn + placeholder block -->
      <div class="block block--text" style="--area:1/2/16/13">
        <div class="contact-intro">
          <h2 class="content-heading">Let&rsquo;s Work Together</h2>
          <p class="content-body">If you want to to chat about my work, please feel free to contact me here or reach out on LinkedIn. I&rsquo;d love to connect!</p>
          <a class="btn--link" href="https://www.linkedin.com/in/milo-tacheny/" target="_blank" rel="noopener">LinkedIn</a>
          <iframe class="contact-map" title="Map of Saint Paul, Minnesota" src="https://maps.google.com/maps?q=Saint+Paul,+Minnesota&amp;z=11&amp;output=embed" loading="lazy"></iframe>
        </div>
      </div>

      <!-- Right column: contact form -->
      <div class="block" style="--area:1/14/16/26">
        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-field">
            <span class="form-group__label">Name</span>
            <div class="form-row">
              <label class="form-label">First Name <span class="req">(required)</span>
                <input type="text" name="firstName" autocomplete="given-name" required>
              </label>
              <label class="form-label">Last Name <span class="req">(required)</span>
                <input type="text" name="lastName" autocomplete="family-name" required>
              </label>
            </div>
          </div>

          <label class="form-label form-field"><span>Email <span class="req">(required)</span></span>
            <input type="email" name="email" autocomplete="email" required>
          </label>

          <label class="form-label form-field"><span>Subject <span class="req">(required)</span></span>
            <input type="text" name="subject" required>
          </label>

          <label class="form-label form-field"><span>Message <span class="req">(required)</span></span>
            <textarea name="message" rows="4" required></textarea>
          </label>

          <button type="submit">Submit</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>

    </div>
  </section>

</main>

<script>
  /* ---------------------------------------------------------------------
     Contact form handling.

     GitHub Pages is static — there is no server to receive a POST. Until a
     form backend is connected, this composes a pre-filled email in the
     visitor's mail app (works everywhere, zero setup).

     TODO: set CONTACT_EMAIL to the real destination address. To upgrade to a
     proper in-page submit (no mail app), sign up for a form service
     (Formspree / Basin / Getform) or a Cloudflare Worker and swap the handler
     for a fetch() POST to its endpoint.
     --------------------------------------------------------------------- */
  var CONTACT_EMAIL = "tacheny.m@gmail.com";

  (function () {
    var form = document.getElementById("contact-form");
    var status = document.getElementById("form-status");
    if (!form) return;

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!form.reportValidity()) return;

      var d = new FormData(form);
      var name = ((d.get("firstName") || "") + " " + (d.get("lastName") || "")).trim();
      var subject = d.get("subject") || "Website enquiry";
      var body =
        "Name: " + name + "\n" +
        "Email: " + (d.get("email") || "") + "\n\n" +
        (d.get("message") || "");

      window.location.href =
        "mailto:" + CONTACT_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);

      status.textContent = "Opening your email app…";
    });
  })();
</script>
